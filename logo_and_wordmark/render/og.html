<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>

  <div id="card">
    <div class="ring" style="width:560px;height:560px;top:-220px;right:-170px;"></div>
    <div class="ring" style="width:380px;height:380px;bottom:-170px;left:-120px;"></div>
    <div style="display:flex;align-items:center;gap:42px;z-index:1;">
      <img src="../svg/mark/newfind-mark-linen.svg" style="height:150px;display:block;">
      <img src="../svg/wordmark/newfind-wordmark-linen.svg" style="height:118px;display:block;">
    </div>
    <div style="font-size:36px;color:#BCD0CB;z-index:1;letter-spacing:0.005em;">Find events and communities, anywhere</div>
  </div>

</html>
